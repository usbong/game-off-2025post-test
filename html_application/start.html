<html xmlns="http://www.w3.org/1999/xhtml">
  <head>
	<meta name="viewport" content="width=device-width, initial-scale=0.5, maximum-scale=0.5, user-scalable=no, viewport-fit=contain" />
  </head>
<html>
 <style type="text/css">
		html, body
        {
            font-family: Arial;
			font-size: 11pt;

			width: 100%;
			height: 100%;
			
			background-color: black;/*#261912;*/ /*white; transparent*/

			border: none;

			padding: 0;
			margin: 0;
			
			/*min-width: 100dvw;*/
			
			min-height: 100dvh;          /* Forces the body to fill the full viewport height */
			display: flex;
			justify-content: center;  /* Centers horizontally */
			/*justify-content: left;*/
			
			align-items: center; /* Centers vertically */

			/* //added by Mike, 20221002
			//reference: https://www.w3schools.com/howto/howto_css_disable_text_selection.asp;
			//last accessed: 20221002
			*/

			-webkit-user-select: none; /* Safari */
			-ms-user-select: none; /* IE 10 and IE 11 */
			user-select: none; /* Standard syntax */

			/* edited by Mike, 20260809; from 20221012 */
			transform: scale(1);
			transform-origin: top left;  

			/*zoom: 0.8;*/

			/* added by Mike, 20221119 */
			touch-action: none;
		}
		
		iframe
		{
			border: 0;
/*
			border: 2px dotted gray;
*/			
		}
		
		button.buttonToggleFullScreen
		{
			position: relative;
/*
			position: absolute;
*/
			width: 2em;
			height: 2em;

			font-family: Arial;
			font-size: 1rem;
			color: red;

			margin: 0;
			padding: 0;
/*
			margin-top: -3.5em;
			margin-left: -3.5em;
*/			

			border: 1px dotted white;
			background: transparent;
		}
</style>
<script>

	initReset();

	//works only on mobile; Android; iOS;

	//reference: Google AI Overview
    let meta = document.querySelector('meta[name="viewport"]');
	
	//added by Mike, 20260929
	var myIFrame = document.getElementById('myIFrameId');
	
	var bIsMobile=false;
	var bIsUsingAppleWebKit=false;

	//alert(document.documentElement.clientHeight); //386

	const iViewportMaxHeight=480;

	//var fInitialScale=iViewportMaxHeight/document.documentElement.clientHeight;

	//reference: Google AI Overview; CSS-Tricks
	const currZoomFactor = window.devicePixelRatio;

	//alert(currZoomFactor); 

	//removed by Mike, 20260926
	var fInitialScale=1.0;//currZoomFactor;//1.0;

	//alert("screen.height: "+screen.height);
	alert("window.innerHeight: "+window.innerHeight);
	alert("iViewportMaxHeight: "+iViewportMaxHeight);
*/

	if (window.innerHeight>iViewportMaxHeight) {
		fInitialScale=window.innerHeight/iViewportMaxHeight;
	}
	//300/480=0.625
	else {
		//edited by Mike, 20260928
		//fInitialScale=1+(1-window.innerHeight/iViewportMaxHeight);
		fInitialScale=window.innerHeight/iViewportMaxHeight;
	}
*/
    //const iMarginTop=screen.height*0.001;
	//fInitialScale=(screen.height)/iViewportMaxHeight;
	
	fInitialScale=window.innerHeight/iViewportMaxHeight;
		
	//fails on iPad
	//meta.setAttribute('content', 'width=device-width, initial-scale='+fInitialScale+', maximum-scale='+fInitialScale+', user-scalable=no');
			
    if (/Macintosh|Mac|Mobile|Android|webOS|iPhone|iPad|iPod|AppleWebKit|BlackBerry|BB|PlayBook|IEMobile|Windows Phone|Kindle|Silk|Opera Mini/i.test(navigator.userAgent)) {

//		alert("detected: Mobile Browser!");

	  //added by Mike, 20220925
	  bIsMobile=true;

	  //added by Mike, 20221108
	  if (navigator.userAgent.includes("AppleWebKit")) {
		bIsUsingAppleWebKit=true;
		bIsUsingAppleMac=false; //default
	  }

	  //added by Mike, 20221113
	  //notes: "AppleWebKit" to exist even with "Android"
	  if (navigator.userAgent.includes("Android")) {
		bIsUsingAppleWebKit=false;
	  }

	  //added by Mike, 20221113
	  //example: Linux x86_64 (desktop)
	  if (navigator.userAgent.includes("Linux x")) {
		bIsMobile=false;
	  }

	  //note: iPAD and MacBookPro OS : Mac OS X
	  //adds: to be re-classified as iPAD via TOUCH command
	  if ((navigator.userAgent.includes("Macintosh")) || navigator.userAgent.includes("Mac")) {
		bIsUsingAppleMac=true;
		bIsMobile=false; //added by Mike, 20260929
	  }

	  if (navigator.userAgent.includes("Edge")) { //not "Edg"
		bIsMobile=false;
	  }
	}

	//added by Mike, 20260908
    if ((bIsMobile) && (!bIsUsingAppleWebKit)) { //and Android
	  //added by Mike, 20260908
	  //reference: Google AI Overview
	  if (meta) {
		//meta.setAttribute('content', 'width=device-width, initial-scale=0.75, maximum-scale=1.0, user-scalable=no');
		
		//added by Mike, 20260925
		fInitialScale=0.75;
		
		meta.setAttribute('content', 'width=device-width, initial-scale='+fInitialScale+', maximum-scale='+fInitialScale+', user-scalable=no');
	  }
    }
    else {

	 //alert(navigator.userAgent);

/*	//edited by Mike, 20260926; "document.body.style.zoom" doesn't also seem to work even on Google Chrome;
	 if (/Firefox/i.test(navigator.userAgent)) {
		//automated "document.body.style.zoom" not available
	 }
	 //if not using Firefox browser;
	 else {
*/
		  if (meta) {
			  //edited by Mike, 20260926
/*
			  //error; 100% value could vary depending on monitor; not necessarily always 1.5 
			  fCurrZoomPercentValue=currZoomFactor/1.875; //1.5;
			  //fInitialScale=(1/fCurrZoomPercentValue).toFixed(2);
			  fInitialScaleWithZoomFactor=(fInitialScale/fCurrZoomPercentValue).toFixed(2);

alert("currZoomFactor: "+currZoomFactor);
alert("fInitialScaleWithZoomFactor: "+fInitialScaleWithZoomFactor);
alert("fInitialScale: "+fInitialScale);

			  //fInitialScale*=fInitialScaleWithZoomFactor;

			  fInitialScale=fInitialScaleWithZoomFactor;
*/
			  //edited by Mike, 20260929
			  //fInitialScale=(fInitialScale/0.80).toFixed(2);

			  //alert(">>>fInitialScale: "+fInitialScale);

			  //document.body.style.zoom = fInitialScale; 
			  //document.body.style.zoom = 1.0;
			  
			  //added by Mike, 20260929
			  document.body.style.marginTop = (0) + 'px';
			  myIFrame.style.marginTop = (0) + 'px';
			  
			  //added by Mike, 20260928
			  //TODO: -note down; values for zoom 100%; to be used when bHasEnteredFulLScreenToggle=true;
			  //browser tab hangs if zoom is changed too much;

			  document.body.style.transform = "scale("+fInitialScale+")"; //"scale(2.0)";
			  //document.body.style.transformOrigin = "top left"; // Keeps layout aligned correc
			  
			  //edited by Mike, 20260929
			  document.body.style.transformOrigin = "top center"; // Keeps layout aligned correc

			  meta.setAttribute('content', 'width=device-width, initial-scale='+fInitialScale+', maximum-scale='+fInitialScale+', user-scalable=no');

			  ////alert("fCurrZoomPercentValue: "+fCurrZoomPercentValue);
			  //alert("fInitialScale: "+fInitialScale);

			  //edited by Mike, 20260926
			  //document.body.style.justifyContent="left";
			  document.body.style.justifyContent="center";
			  
			  document.body.style.overflow = 'hidden'; //reference; Google AI Overview; SitePoint
			  
			  ////alert("myIFrame.getBoundingClientRect().width!! "+myIFrame.getBoundingClientRect().width);
			  ////alert("window.innerWidth: "+window.innerWidth);
			  
			  //var iMarginLeft=(((window.innerWidth-myIFrame.getBoundingClientRect().width))/2);
			  var iMarginLeft=0;

			  ////alert("fInitialScale: "+fInitialScale);
			  ////alert(iMarginLeft);

			  //edited by Mike, 20260929
			  var iMarginTop=(((window.innerHeight-myIFrame.getBoundingClientRect().height))/2);
			  //var iMarginTop=(((screen.height-myIFrame.getBoundingClientRect().height))/2);

			  //alert(iMarginTop);
			  
			  document.body.style.marginLeft = (0 + iMarginLeft) + 'px';
			  
			  //edited by Mike, 20260928
			  //document.body.style.marginTop = (0 + iMarginTop) + 'px';

			//document.body.style.marginTop = (0 + iMarginTop) + 'px';

			  if (!bHasEnteredFulLScreenToggle) {
				document.body.style.marginTop = (0 + iMarginTop) + 'px';
				document.body.style.alignItems = "top";

				myIFrame.style.marginTop = (0) + 'px';
			  } 
			  else {
			    iMarginTop=0;//(((screen.height-myIFrame.getBoundingClientRect().height))/2);

				document.body.style.marginTop = (0) + 'px';
				document.body.style.alignItems = "center";

				myIFrame.style.marginTop = (0 + iMarginTop) + 'px';
			  }

			  //myIFrame.style.marginTop = (0 + iMarginTop) + 'px';

			  //document.body.style.justifyContent="center";
			  //document.body.style.justifyContent="left";	

			  //alert("END!!!");

			  ////alert(iMarginTop);			  
			  ////alert(iViewportMaxHeight);

			  //alert(iMarginLeftIfNotCentered);			  
			  //alert(iViewportMaxWidth);

/*
	    }
*/		
	  }
    }

/*	
	//removed by Mike, 20260929; from 20260928
	//prevents zoom change; but causing browser tab hanging; when user persists on changing the zoom value;
	//not working on itch.io
	//Reference: Googla AI Overview; Stackoverflow;
	window.addEventListener('resize', () => {
		// Check if the window matches the screen's dimensions
		const isFullscreen = (window.innerWidth === screen.width && window.innerHeight === screen.height);

		if (isFullscreen) {
			//alert("ENTERED FULLSCREEN!!");
			init(); //auto-rescale
		} else {
			//alert("EXITED FULLSCREEN!!");
			init(); //auto-rescale
		}
	});
*/
	  
	//added by Mike, 20260925
	//otherwise, keyboard won't register unless user does a mouse-click;
	document.getElementById('myIFrameId').focus();	
	
	//alert("START!!!");
  }
  
  function initReset() {
	document.body.style.transform = "scale("+1.0+")"; //fInitialScale
	document.body.style.transformOrigin = "top center";
	
	document.getElementById('myIFrameId').focus();	
  }
  
  function onFullscreenToggle() {
	//reference; MDN Web Docs; Stackoverflow
	const element = document.getElementById("myBodyId");//divIframeWrapperId"); 
	
	if (!document.fullscreenElement) {
		  element.requestFullscreen()
			.then(() => {
			  //alert("ENTERED FULLSCREEN!!");

			  bHasEnteredFulLScreenToggle=true;

			  init();
			})
			.catch((err) => {
			  //console.error(`Error enabling fullscreen: ${err.message}`);
			});

    } else {
        document.exitFullscreen()			
			.then(() => {
			  //alert("EXITED FULLSCREEN!!");

			  bHasEnteredFulLScreenToggle=false;

			  initReset(); //init();
			})
			.catch((err) => {
			  //console.error(`Error exiting fullscreen: ${err.message}`);
			});
    }
	

	//});
  }
</script>
<body id="myBodyId" onload="onLoad();">
	<div class="my-container" id="divIframeWrapperId">

		<iframe id="myIFrameId" src="indexWithStart.html" width="644px" height="364px"
			allow="fullscreen; autoplay; encrypted-media; geolocation" 
			allowfullscreen="true"
			webkitallowfullscreen="true" 
			mozallowfullscreen="true"></iframe>

		<button id="buttonToggleFullScreenId" onclick="onFullscreenToggle()" class="buttonToggleFullScreen">⤢</button>	
	</div>
</body>
</html>
