<!DOCTYPE html>
<html>
<body onload="onLoad();">
<!--
<h1>HTML5 Canvas</h1>
-->
<h2>Image Scale Test</h2>

<canvas id="myCanvasId" width="300" height="150" style="border:1px solid grey"></canvas>

<script>

	const fFramesPerSecondDefault=16.66;
	//const fFramesPerSecondDefault=33.33;
	var fFramesPerSecond=fFramesPerSecondDefault;
	var iCurrentIntervalId=-1;

	//reference: https://developer.mozilla.org/en-US/docs/Web/CSS/Reference/Values/transform-function/scale;
	//last accessed: 20261030
	var fScaleX=1.3;
	var fScaleY=0.4;
	
	const iImageWidth=32;
	const iImageHeight=32;

	const fPosXDefault=150/2+iImageWidth;//0;//300;
	
	var fPosX=fPosXDefault;//0;//300;
	var fPosY=0;

	const px = iImageWidth/2;//32; // X coordinate of the specific point
	const py = iImageHeight/2//32; // Y coordinate of the specific point

	function onLoad() {
		clearInterval(iCurrentIntervalId);
		iCurrentIntervalId=setInterval(myUpdateFunction, fFramesPerSecond);
	}

	function myUpdateFunction() {
		const canvas = document.getElementById("myCanvasId");
		const myCanvasContext = canvas.getContext("2d");

		//ctx.fillRect(20, 20, 150, 100);

		canvas.style.transformOrigin = 'center center'; // or '50px 50px'

		const img = new Image();
		img.src = "assets/images/favicon.png";//'path/to/image.jpg';

		myCanvasContext.clearRect(0, 0, canvas.width, canvas.height);

		myCanvasContext.save();

		//myCanvasContext.translate(px*fScaleX, py);
		//myCanvasContext.translate(px, py);
		myCanvasContext.translate(px*fScaleX, py*fScaleY);
		
		myCanvasContext.scale(fScaleX, fScaleY);

		//myCanvasContext.translate(-px*fScaleX, -py);
		//myCanvasContext.translate(-px, -py);
		myCanvasContext.translate(-px*fScaleX, -py*fScaleY);
		
		myCanvasContext.drawImage(img, fPosX, fPosY);
		
		fPosY+=0.1;
		fScaleY+=0.003;

/*
		fScaleX+=0.01;
		fPosX-=0.1;
*/		
		if (fPosY+iImageHeight*fScaleY*0.65>canvas.height) {
			fPosY=0-iImageHeight/2;
			fScaleY=0.4;
			
			fPosX=fPosXDefault;
			fScaleX=1.3;
			
			//alert("DITO!!");
		}
		
		
		//alert(fPosY);
		
		myCanvasContext.restore();
}
</script>

</body>
</html>
